[package]
name = "weckpilot"
version = "1.0.2"
description = "A modern alarm clock with weekly schedules for Linux"
authors = ["Norbert Jander"]
license = "MIT"
repository = "https://github.com/nojan01/WeckPilot-Linux"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.2", features = ["unstable"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
chrono = "0.4"
zbus = "5"
